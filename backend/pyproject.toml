[project]
name = "persian-ai-pulse"
version = "0.1.0"
description = "Modular ingestion -> intelligence -> publish pipeline for a daily Persian AI news & podcast digest."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "feedparser>=6.0",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Only needed if you actually run dedup/summarization/TTS locally.
intelligence = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "openai>=1.30",
]
tts = [
    "edge-tts>=6.1",
]
telegram = [
    "telethon>=1.36",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
pap = "persian_ai_pulse.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
